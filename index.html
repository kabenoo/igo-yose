<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>囲碁ヨセトレ</title>
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <meta name="apple-mobile-web-app-title" content="囲碁ヨセトレ">
  <meta name="theme-color" content="#e8efd9">
  <style>
    :root{
      --ink:#2c180f;
      --cream:#fffdf6;
      --gold:#c9a758;
      --gold-light:#eadca9;
      --sakura:#f8dce5;
      --sakura-deep:#d99aae;
      --green:#3d8e60;
      --green-dark:#286846;
      --board:#b66f32;
      --board-dark:#8d4d20;
      --shadow:0 10px 26px rgba(74,43,21,.18);
    }
    *{box-sizing:border-box}
    html{background:#e8efd9}
    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Mincho ProN","Yu Mincho","Yu Gothic","Meiryo",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 7%,rgba(255,255,255,.95) 0 2px,transparent 3px),
        radial-gradient(circle at 88% 12%,rgba(255,255,255,.8) 0 3px,transparent 4px),
        linear-gradient(135deg,rgba(255,255,255,.62),transparent 35%),
        repeating-linear-gradient(45deg,rgba(163,134,91,.055) 0 1px,transparent 1px 5px),
        linear-gradient(135deg,#fffaf0 0%,#eef3dc 52%,#dce8c8 100%);
      background-attachment:fixed;
    }
    body::before,body::after{
      content:"";
      position:fixed;
      z-index:-1;
      width:44vw;height:44vw;
      max-width:520px;max-height:520px;
      border-radius:50%;
      opacity:.38;
      filter:blur(1px);
      pointer-events:none;
    }
    body::before{left:-18vw;top:18vh;background:radial-gradient(circle,#f5c3d1 0 7%,transparent 8% 100%)}
    body::after{right:-20vw;bottom:-8vh;background:radial-gradient(circle,#e7c7a4 0 7%,transparent 8% 100%)}
    .app{max-width:760px;margin:0 auto;padding:10px 10px 22px}
    .titleCard,.boardCard,.bottomCard,.tagline{
      position:relative;
      background:rgba(255,253,246,.91);
      border:2px solid rgba(201,167,88,.72);
      box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.7);
    }
    .titleCard{
      min-height:92px;
      margin-bottom:10px;
      border-radius:22px;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
      background:
        radial-gradient(ellipse at 17% 78%,rgba(202,209,201,.65),transparent 26%),
        radial-gradient(ellipse at 83% 78%,rgba(202,209,201,.55),transparent 24%),
        linear-gradient(180deg,rgba(255,255,255,.98),rgba(253,249,240,.94));
    }
    .titleCard::before,.titleCard::after{
      content:"❀";position:absolute;top:8px;font-size:39px;color:#e6a9b8;text-shadow:18px 12px 0 #f4c9d3,34px 2px 0 #d990a4;
    }
    .titleCard::before{left:13px;transform:rotate(-14deg)}
    .titleCard::after{right:45px;transform:scaleX(-1) rotate(-14deg)}
    .titleWrap{
      position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:.05em;
      font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(30px,9vw,52px);
      font-weight:700;letter-spacing:.04em;white-space:nowrap;text-shadow:0 2px 0 #fff;
    }
    .titleGreen,.titleBlue,.titleRed{color:var(--ink);background:none;-webkit-text-fill-color:var(--ink)}
    .customTitleImg{display:none;max-width:min(92vw,520px);width:100%;height:auto;object-fit:contain}
    .boardCard{padding:10px;border-radius:25px;margin-bottom:10px;background:linear-gradient(145deg,#b9783d,#8d4d20)}
    .boardCard::before{
      content:"✿　✿　✿　✿　✿";display:block;text-align:center;color:rgba(255,225,185,.55);
      font-size:18px;letter-spacing:.45em;margin:-3px 0 3px;
    }
    .board-wrap{
      width:100%;aspect-ratio:1/1;max-width:min(96vw,680px);margin:0 auto;position:relative;
      touch-action:manipulation;border-radius:14px;overflow:hidden;
      border:2px solid rgba(85,42,13,.65);box-shadow:inset 0 0 22px rgba(69,30,8,.2),0 4px 12px rgba(0,0,0,.2)
    }
    canvas{width:100%;height:100%;display:block;background:linear-gradient(135deg,var(--board),var(--board-dark))}
    .bottomCard{padding:9px;border-radius:25px;background:rgba(255,253,248,.93);overflow:hidden}
    .bottomCard::after{
      content:"";position:absolute;left:-3%;bottom:-55px;width:63%;height:135px;border-radius:50%;
      background:radial-gradient(circle at 40% 40%,rgba(248,190,207,.6) 0 7%,transparent 8%),
                 radial-gradient(circle at 58% 53%,rgba(221,91,119,.55) 0 6%,transparent 7%);
      pointer-events:none;opacity:.65
    }
    .bottomGrid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr 1.55fr;gap:7px;align-items:stretch}
    .stack{display:grid;gap:7px;align-content:start}
    button{
      width:100%;min-height:48px;border:2px solid rgba(188,145,87,.55);border-radius:18px;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Yu Gothic",serif;font-size:clamp(12px,3.2vw,18px);
      font-weight:900;cursor:pointer;color:var(--ink);letter-spacing:0;
      white-space:nowrap;word-break:keep-all;overflow-wrap:normal;
      box-shadow:inset 0 2px 0 rgba(255,255,255,.82),0 4px 10px rgba(80,50,25,.14);
      -webkit-tap-highlight-color:transparent;transition:transform .08s ease,filter .08s ease
    }
    button:active{transform:translateY(1px);filter:brightness(.96)}
    .btnDead,.btnPlain{
      background:linear-gradient(145deg,#fff,#fbf7ec);color:#2b1c14;
    }
    .btnDead{background:linear-gradient(145deg,#fff,#f9f4e8)}
    .btnGreen{
      background:linear-gradient(145deg,#57a873,#2f7d52);color:#fff;border-color:#cfb37a;text-shadow:0 1px 2px rgba(0,0,0,.25)
    }
    .btnBlue{
      background:linear-gradient(180deg,#4b9565,#23623f);color:#fff;border-color:#cdb47d;
      text-shadow:0 2px 2px rgba(0,0,0,.28)
    }
    .btnActive{outline:4px solid rgba(214,111,137,.28);background:linear-gradient(145deg,#fbe8ee,#fff)}
    .btnDead.btnActive{background:linear-gradient(145deg,#e8f5ee,#cfead9)}
    .problemRow{
      grid-column:1 / -1;
      display:grid;
      grid-template-columns:1fr 1fr 1.55fr;
      gap:7px;
      align-items:stretch;
      margin-top:1px
    }
    .problemSpacer{min-height:1px}
    .problemBadge{
      min-height:76px;border-radius:22px;border:2px solid rgba(188,145,87,.62);
      background:linear-gradient(145deg,#fffdf7,#f5ead3);display:flex;align-items:center;justify-content:center;
      text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:900;
      font-size:clamp(14px,3.7vw,20px);line-height:1.2;color:#342117;padding:8px 6px;white-space:nowrap;
      box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 4px 10px rgba(80,50,25,.12)
    }
    #loadRandomBtn{min-height:76px;font-size:clamp(17px,4.5vw,26px);border-radius:22px;white-space:nowrap}
    .resultBox{
      min-height:100px;border-radius:22px;border:2px solid #d6b5bc;
      background:linear-gradient(145deg,#fff8fb,#f7dfe7);display:flex;align-items:center;justify-content:center;
      text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:900;
      font-size:clamp(22px,6vw,34px);color:#2f201b;padding:8px 10px;letter-spacing:.16em;
      box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 4px 12px rgba(94,52,60,.12);white-space:nowrap
    }
    .tagline{
      margin-top:10px;padding:13px 12px;border-radius:18px;text-align:center;
      font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(16px,4.2vw,24px);
      font-weight:700;letter-spacing:.04em;background:rgba(255,250,243,.84)
    }
    .tagline::before,.tagline::after{content:"❀";color:#d995aa;margin:0 .55em}
    @media(max-width:480px){
      .app{padding:5px 5px 14px}.titleCard{min-height:69px;margin-bottom:5px;border-radius:15px}
      .titleCard::before,.titleCard::after{font-size:25px}.boardCard{padding:6px;margin-bottom:5px;border-radius:17px}
      .boardCard::before{font-size:12px;margin:-3px 0 2px}.bottomCard{padding:5px;border-radius:17px}
      .bottomGrid,.stack,.problemRow{gap:4px}button{min-height:40px;border-radius:13px;font-size:clamp(11px,3vw,15px)}
      .problemBadge,#loadRandomBtn{min-height:68px;border-radius:15px}.problemBadge{font-size:clamp(12px,3.1vw,16px);padding:5px 2px}
      #loadRandomBtn{font-size:clamp(15px,4vw,21px);padding-left:4px;padding-right:4px}
      .resultBox{min-height:84px;border-radius:15px}.tagline{margin-top:5px;padding:9px 5px;border-radius:13px}
    }

    .screen{display:none}
    .screen.active{display:block}
    .menuScreen{
      min-height:100vh;
      padding:18px 12px 28px;
      background:
        linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)),
        repeating-linear-gradient(90deg,rgba(92,58,28,.07) 0 2px,transparent 2px 76px),
        repeating-linear-gradient(0deg,rgba(92,58,28,.05) 0 2px,transparent 2px 76px),
        linear-gradient(180deg,#ceb08b 0 20%,#eadbc2 20% 64%,#d7c296 64% 100%);
    }
    .menuRoom{
      max-width:760px;margin:0 auto;position:relative;
      border-radius:28px;padding:14px;
      background:
        linear-gradient(90deg,rgba(92,53,25,.85) 0 3%,transparent 3% 97%,rgba(92,53,25,.85) 97%),
        linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.12));
      box-shadow:0 18px 44px rgba(69,39,17,.24),inset 0 0 0 3px rgba(255,255,255,.45)
    }
    .menuTitle{
      border:3px solid #c8a75c;border-radius:24px;
      background:
        radial-gradient(ellipse at 15% 80%,rgba(195,205,195,.66),transparent 27%),
        radial-gradient(ellipse at 85% 80%,rgba(195,205,195,.6),transparent 27%),
        linear-gradient(180deg,#fff,#faf5e9);
      padding:18px 10px;text-align:center;margin-bottom:14px;
      font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
      font-weight:900;font-size:clamp(34px,9vw,58px);letter-spacing:.04em;
      box-shadow:0 7px 18px rgba(67,38,17,.15),inset 0 0 0 3px rgba(255,255,255,.75)
    }
    .menuTitle::before,.menuTitle::after{content:"❀";color:#dfa0b1;font-size:.7em;margin:0 .28em}
    .menuPanel{
      border:2px solid #c7a568;border-radius:22px;background:rgba(255,252,244,.94);
      padding:12px;margin-bottom:12px;
      box-shadow:0 8px 18px rgba(70,42,22,.13),inset 0 0 0 3px rgba(255,255,255,.65)
    }
    .menuHeading{
      display:inline-block;margin:-3px auto 10px;left:50%;transform:translateX(-50%);position:relative;
      background:linear-gradient(180deg,#6f3c18,#4e2a14);color:#fff6e7;
      border:2px solid #caa75c;border-radius:14px;padding:7px 22px;
      font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:900;
      font-size:clamp(18px,5vw,28px);letter-spacing:.08em;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.35)
    }
    .choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .choiceCard{
      min-height:112px;background:linear-gradient(145deg,#fff,#f7efdf);color:#2f1c12;
      border:2px solid #d0b176;border-radius:18px;padding:12px 8px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;white-space:normal
    }
    .choiceCard strong{font-size:clamp(18px,5vw,27px);margin-bottom:4px}
    .choiceCard small{font-size:clamp(11px,3vw,15px);font-weight:600;line-height:1.4}
    .choiceCard.selected{outline:5px solid rgba(177,50,56,.18);background:linear-gradient(145deg,#fff8f4,#f7e1dd)}
    .choiceCard.selected::before{content:"✓";position:absolute}
    .themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .themeCard{
      min-height:155px;border-radius:18px;border:2px solid #cfb077;padding:8px;
      display:flex;flex-direction:column;justify-content:flex-end;
      font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:900;
      white-space:normal;text-align:center;overflow:hidden
    }
    .themeCard span{background:rgba(255,255,255,.9);padding:8px;border-radius:11px;font-size:clamp(15px,4vw,22px)}
    .themeSakura{
      background:
        radial-gradient(circle at 18% 22%,#f3bdcc 0 7%,transparent 8%),
        radial-gradient(circle at 76% 28%,#f5cad5 0 6%,transparent 7%),
        linear-gradient(145deg,#fff5f7,#dfe9d4);
    }
    .themeLuxury{
      color:#f5e8ba;
      background:
        radial-gradient(circle at 20% 20%,rgba(255,210,83,.28),transparent 28%),
        repeating-linear-gradient(45deg,rgba(218,177,68,.16) 0 2px,transparent 2px 18px),
        linear-gradient(145deg,#21100b,#5b2918);
    }
    .themeCard.selected{outline:5px solid rgba(61,142,96,.25)}
    .menuAction{
      min-height:76px;margin-top:10px;font-size:clamp(25px,7vw,38px);
      background:linear-gradient(180deg,#4b9565,#23623f);color:#fff;border-color:#cdb47d
    }
    .mypageButton{
      min-height:68px;margin-top:10px;font-size:clamp(21px,6vw,32px);
      background:linear-gradient(180deg,#a53f33,#77271f);color:#fff;border-color:#cdb47d
    }
    .menuNote{font-size:12px;text-align:center;margin-top:8px;color:#6b4a32}
    .studyToolbar{
      max-width:760px;margin:0 auto;padding:6px 10px 0;display:flex;justify-content:flex-end
    }
    .backMenuBtn{
      width:auto;min-height:38px;padding:6px 14px;border-radius:13px;
      background:linear-gradient(145deg,#fff,#f5ead7);font-size:14px
    }
    .numberModal,.mypageModal{
      position:fixed;inset:0;z-index:50;background:rgba(25,16,10,.58);
      display:none;align-items:center;justify-content:center;padding:14px
    }
    .numberModal.open,.mypageModal.open{display:flex}
    .modalPanel{
      width:min(680px,96vw);max-height:88vh;overflow:auto;
      background:#fffaf0;border:3px solid #c7a568;border-radius:24px;padding:14px;
      box-shadow:0 20px 60px rgba(0,0,0,.35)
    }
    .modalPanel h2{margin:2px 0 12px;text-align:center;font-family:"Yu Mincho",serif}
    .numberGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .numberBtn{min-height:48px;font-size:16px;background:#fff;border-radius:12px}
    .modalClose{margin-top:12px;background:#7a4a2c;color:#fff}
    .mypageSummary{
      padding:18px;border-radius:18px;background:linear-gradient(145deg,#fff,#f4ead7);
      text-align:center;font-size:20px;line-height:1.7
    }
    body.theme-luxury{
      --ink:#f3e5bd;--cream:#21110d;--gold:#d8b24d;--gold-light:#f0d689;
      --sakura:#6e301f;--sakura-deep:#c79c45;--green:#147f68;--green-dark:#0b5949;
      --board:#d59742;--board-dark:#8e4e1e;
      background:
        repeating-linear-gradient(45deg,rgba(214,171,58,.07) 0 2px,transparent 2px 18px),
        radial-gradient(circle at 50% 10%,rgba(255,190,60,.18),transparent 35%),
        linear-gradient(180deg,#180b08,#3b160e);
    }
    body.theme-luxury .titleCard,
    body.theme-luxury .bottomCard,
    body.theme-luxury .tagline{background:rgba(34,16,12,.94);border-color:#d0a94a;color:#f4e3b3}
    body.theme-luxury .titleCard{
      background:
        radial-gradient(circle at 18% 60%,rgba(14,135,104,.45),transparent 32%),
        linear-gradient(180deg,#1d0e0b,#3f1c13);
    }
    body.theme-luxury .titleGreen{color:#7ed0a6;-webkit-text-fill-color:#7ed0a6}
    body.theme-luxury .titleBlue{color:#9fc7ff;-webkit-text-fill-color:#9fc7ff}
    body.theme-luxury .titleRed{color:#ff9588;-webkit-text-fill-color:#ff9588}
    body.theme-luxury .bottomCard::after{display:none}
    body.theme-luxury .btnPlain,
    body.theme-luxury .btnDead{background:linear-gradient(145deg,#592315,#32130e);color:#f7df9d;border-color:#c69b3f}
    body.theme-luxury .btnGreen,
    body.theme-luxury .btnBlue{background:linear-gradient(145deg,#2ea88c,#116653);border-color:#d7b350}
    body.theme-luxury .resultBox{background:linear-gradient(145deg,#eee,#bfbfbf);color:#21150e;border-color:#999}
    body.theme-luxury .problemBadge{background:linear-gradient(145deg,#4b1d13,#2c100c);color:#f4dda0;border-color:#d4aa47}
    body.theme-luxury .tagline::before,
    body.theme-luxury .tagline::after{color:#d8b24d}
    @media(max-width:480px){
      .menuScreen{padding:8px 5px 18px}.menuRoom{padding:8px;border-radius:18px}
      .menuTitle{padding:12px 4px;border-radius:16px;margin-bottom:8px}
      .menuPanel{padding:8px;border-radius:16px;margin-bottom:8px}.menuHeading{padding:5px 12px}
      .choiceGrid,.themeGrid{gap:6px}.choiceCard{min-height:90px;padding:8px 4px;border-radius:13px}
      .themeCard{min-height:122px;border-radius:13px}.menuAction{min-height:60px}.mypageButton{min-height:54px}
      .numberGrid{grid-template-columns:repeat(5,1fr);gap:5px}.numberBtn{min-height:42px;font-size:14px}
    }

  </style>
</head>
<body>
<section id="menuScreen" class="screen menuScreen active">
  <div class="menuRoom">
    <div class="menuTitle">囲碁ヨセトレ</div>

    <div class="menuPanel">
      <div class="menuHeading">出題方法を選択</div>
      <div class="choiceGrid">
        <button class="choiceCard selected" id="modeRandomBtn">
          <strong>ランダム出題</strong>
          <small>100問からランダムに出題します</small>
        </button>
        <button class="choiceCard" id="modeNumberBtn">
          <strong>番号選択</strong>
          <small>問題番号を選んで出題します</small>
        </button>
      </div>
    </div>

    <div class="menuPanel">
      <div class="menuHeading">学習画面を選択</div>
      <div class="themeGrid">
        <button class="themeCard themeSakura selected" id="themeSakuraBtn"><span>桜と和の画面</span></button>
        <button class="themeCard themeLuxury" id="themeLuxuryBtn"><span>黒と金の画面</span></button>
      </div>
    </div>

    <button class="menuAction" id="startLearningBtn">学習を始める</button>
    <button class="mypageButton" id="openMypageBtn">マイページ</button>
    <div class="menuNote">正解記録は正解判定機能を追加した後に表示します。</div>
  </div>
</section>

<section id="studyScreen" class="screen">
  <div class="studyToolbar"><button class="backMenuBtn" id="backMenuBtn">メニューに戻る</button></div>
<div class="app">
  <div class="titleCard">
    <div class="titleWrap" id="titleWrap">
      <span class="titleGreen">囲碁</span>
      <span class="titleBlue">ヨセ</span>
      <span class="titleRed">トレ</span>
    </div>
    <img id="customTitleImg" class="customTitleImg" src="title.png" alt="囲碁ヨセトレ">
  </div>

  <div class="boardCard">
    <div class="board-wrap">
      <canvas id="boardCanvas" width="900" height="900"></canvas>
    </div>
  </div>

  <div class="bottomCard">
    <div class="bottomGrid">
      <div class="stack">
        <button class="btnDead" id="deadModeBtn">死石指定</button>
        <button class="btnPlain" id="undoBtn">一手戻る</button>
      </div>

      <div class="stack">
        <button class="btnGreen" id="scoreBtn">地合判定</button>
        <button class="btnPlain" id="resetBtn">初期画面</button>
      </div>

      <div class="resultBox" id="resultBox">結　果</div>

      <div class="problemRow">
        <div class="problemSpacer" aria-hidden="true"></div>
        <div class="problemBadge" id="problemBadge">問題 ---</div>
        <button class="btnBlue" id="loadRandomBtn">問題読込</button>
      </div>
    </div>
  </div>

  <div class="tagline">一目を笑うものは一目に泣く</div>
</div>
</section>

<div class="numberModal" id="numberModal">
  <div class="modalPanel">
    <h2>問題番号を選択</h2>
    <div class="numberGrid" id="numberGrid"></div>
    <button class="modalClose" id="closeNumberModal">閉じる</button>
  </div>
</div>

<div class="mypageModal" id="mypageModal">
  <div class="modalPanel">
    <h2>マイページ</h2>
    <div class="mypageSummary">正解済み　0 / 100問<br>正解判定機能の追加後、ここに学習記録を表示します。</div>
    <button class="modalClose" id="closeMypageModal">閉じる</button>
  </div>
</div>

<script>
(() => {
  const SIZE = 9;
  const EMPTY = 0, BLACK = 1, WHITE = 2;
  const MODE_NORMAL = 'normal';
  const MODE_DEAD = 'dead';

  const canvas = document.getElementById('boardCanvas');
  const ctx = canvas.getContext('2d');
  const resultBox = document.getElementById('resultBox');
  const problemBadge = document.getElementById('problemBadge');
  const deadModeBtn = document.getElementById('deadModeBtn');

  const state = {
    initialBoard: createEmptyBoard(),
    board: createEmptyBoard(),
    toMove: BLACK,
    moveHistory: [],
    mode: MODE_NORMAL,
    deadStones: new Set(),
    problemNumbers: Array.from({length:100}, (_,i)=>i+1),
    currentProblemNo: null,
    lastMoveColor: null
  };

  function createEmptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
  }
  function cloneBoard(board) { return board.map(r => [...r]); }
  function boardKey(board) { return board.map(r => r.join('')).join('|'); }
  function inBounds(x, y) { return x >= 0 && x < SIZE && y >= 0 && y < SIZE; }
  function other(color) { return color === BLACK ? WHITE : BLACK; }
  function stoneKey(x, y) { return `${x},${y}`; }
  function parseStoneKey(key) {
    const [x, y] = key.split(',').map(Number);
    return { x, y };
  }
  function neighbors(x, y) {
    return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([nx,ny]) => inBounds(nx,ny));
  }

  function groupAndLiberties(board, x, y) {
    const color = board[y][x];
    if (!color) return null;
    const stack = [[x, y]];
    const visited = new Set([stoneKey(x, y)]);
    const group = [];
    const liberties = new Set();

    while (stack.length) {
      const [cx, cy] = stack.pop();
      group.push([cx, cy]);
      for (const [nx, ny] of neighbors(cx, cy)) {
        const v = board[ny][nx];
        const k = stoneKey(nx, ny);
        if (v === EMPTY) liberties.add(k);
        else if (v === color && !visited.has(k)) {
          visited.add(k);
          stack.push([nx, ny]);
        }
      }
    }
    return { color, group, liberties };
  }

  function removeGroup(board, group) {
    for (const [x, y] of group) board[y][x] = EMPTY;
  }

  function placeStone(x, y) {
    if (!inBounds(x, y)) return;
    if (state.board[y][x] !== EMPTY) return;

    const beforeBoard = cloneBoard(state.board);
    const beforeToMove = state.toMove;
    const prevKey = state.moveHistory.length ? state.moveHistory[state.moveHistory.length - 1].beforeKey : null;

    const board = cloneBoard(state.board);
    board[y][x] = state.toMove;

    for (const [nx, ny] of neighbors(x, y)) {
      if (board[ny][nx] === other(state.toMove)) {
        const info = groupAndLiberties(board, nx, ny);
        if (info && info.liberties.size === 0) {
          removeGroup(board, info.group);
        }
      }
    }

    const selfInfo = groupAndLiberties(board, x, y);
    if (!selfInfo || selfInfo.liberties.size === 0) return;

    const newKey = boardKey(board);
    if (prevKey && newKey === prevKey) return;

    state.moveHistory.push({
      beforeBoard,
      beforeToMove,
      beforeKey: boardKey(beforeBoard),
      x, y,
      type: 'move'
    });

    state.board = board;
    state.lastMoveColor = state.toMove;
    state.toMove = other(state.toMove);
    state.deadStones.clear();

    resultBox.textContent = '結　果';
    draw();
  }

  function undo() {
    const last = state.moveHistory.pop();
    if (!last) return;

    state.board = cloneBoard(last.beforeBoard);
    state.toMove = last.beforeToMove;
    state.deadStones.clear();
    state.mode = MODE_NORMAL;
    deadModeBtn.classList.remove('btnActive');

    state.lastMoveColor = state.moveHistory.length
      ? (state.moveHistory[state.moveHistory.length - 1].beforeToMove === BLACK ? WHITE : BLACK)
      : null;

    draw();
  }

  function resetToInitial() {
    state.board = cloneBoard(state.initialBoard);
    state.toMove = BLACK;
    state.moveHistory = [];
    state.mode = MODE_NORMAL;
    state.deadStones.clear();
    state.lastMoveColor = null;
    deadModeBtn.classList.remove('btnActive');

    resultBox.textContent = '結　果';
    draw();
  }

  function toggleDeadStone(x, y) {
    const stone = state.board[y][x];
    if (stone === EMPTY) return;

    const k = stoneKey(x, y);
    if (state.deadStones.has(k)) state.deadStones.delete(k);
    else state.deadStones.add(k);

    draw();
  }

  function scoreGame() {
    const board = cloneBoard(state.board);

    for (const k of state.deadStones) {
      const { x, y } = parseStoneKey(k);
      board[y][x] = EMPTY;
    }

    let blackStones = 0, whiteStones = 0;
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        if (board[y][x] === BLACK) blackStones++;
        else if (board[y][x] === WHITE) whiteStones++;
      }
    }

    const visited = new Set();
    let blackTerritory = 0, whiteTerritory = 0;

    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const k = stoneKey(x, y);
        if (board[y][x] !== EMPTY || visited.has(k)) continue;

        const queue = [[x, y]];
        visited.add(k);
        const empties = [[x, y]];
        const borders = new Set();

        while (queue.length) {
          const [cx, cy] = queue.shift();
          for (const [nx, ny] of neighbors(cx, cy)) {
            const v = board[ny][nx];
            const nk = stoneKey(nx, ny);

            if (v === EMPTY) {
              if (!visited.has(nk)) {
                visited.add(nk);
                queue.push([nx, ny]);
                empties.push([nx, ny]);
              }
            } else {
              borders.add(v);
            }
          }
        }

        if (borders.size === 1) {
          if (borders.has(BLACK)) blackTerritory += empties.length;
          else if (borders.has(WHITE)) whiteTerritory += empties.length;
        }
      }
    }

    let blackTotal = blackStones + blackTerritory;
    let whiteTotal = whiteStones + whiteTerritory;

    if (state.lastMoveColor === BLACK) {
      blackTotal -= 1;
    }

    const diff = blackTotal - whiteTotal;
    let verdict = '持碁';
    if (diff > 0) verdict = `黒 ${diff}目勝ち`;
    else if (diff < 0) verdict = `白 ${Math.abs(diff)}目勝ち`;

    resultBox.textContent = verdict;
  }

  function draw() {
    resizeCanvasForDPR();
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const margin = Math.round(w * 0.085);
    const span = (w - margin * 2) / (SIZE - 1);

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = '#2d2418';
    ctx.lineWidth = Math.max(2, w / 350);

    for (let i = 0; i < SIZE; i++) {
      const p = margin + i * span;

      ctx.beginPath();
      ctx.moveTo(margin, p);
      ctx.lineTo(w - margin, p);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(p, margin);
      ctx.lineTo(p, h - margin);
      ctx.stroke();
    }

    const star = [2, 4, 6];
    for (const sx of star) {
      for (const sy of star) {
        if (((sx === 2 || sx === 6) && (sy === 2 || sy === 6)) || (sx === 4 && sy === 4)) {
          const cx = margin + sx * span;
          const cy = margin + sy * span;
          ctx.beginPath();
          ctx.arc(cx, cy, Math.max(5, w / 120), 0, Math.PI * 2);
          ctx.fillStyle = '#2d2418';
          ctx.fill();
        }
      }
    }

    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const stone = state.board[y][x];
        if (stone === EMPTY) continue;

        const cx = margin + x * span;
        const cy = margin + y * span;
        const r = span * 0.43;

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);

        const grad = ctx.createRadialGradient(cx - r*0.35, cy - r*0.35, r*0.1, cx, cy, r);
        if (stone === BLACK) {
          grad.addColorStop(0, '#555');
          grad.addColorStop(1, '#000');
        } else {
          grad.addColorStop(0, '#fff');
          grad.addColorStop(1, '#d9d9d9');
        }

        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.25)';
        ctx.lineWidth = Math.max(1.2, w / 700);
        ctx.stroke();

        if (state.deadStones.has(stoneKey(x, y))) {
          ctx.strokeStyle = '#e53935';
          ctx.lineWidth = Math.max(4, w / 160);
          ctx.beginPath();
          ctx.moveTo(cx - r*0.62, cy - r*0.62);
          ctx.lineTo(cx + r*0.62, cy + r*0.62);
          ctx.moveTo(cx + r*0.62, cy - r*0.62);
          ctx.lineTo(cx - r*0.62, cy + r*0.62);
          ctx.stroke();
        }
      }
    }
  }

  function resizeCanvasForDPR() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const width = Math.round(rect.width * dpr);
    const height = Math.round(rect.height * dpr);

    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  }

  function getIntersectionFromEvent(ev) {
    const rect = canvas.getBoundingClientRect();
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    const margin = rect.width * 0.085;
    const span = (rect.width - margin * 2) / (SIZE - 1);
    const ix = Math.round((x - margin) / span);
    const iy = Math.round((y - margin) / span);

    if (!inBounds(ix, iy)) return null;

    const cx = margin + ix * span;
    const cy = margin + iy * span;
    const dist = Math.hypot(x - cx, y - cy);
    if (dist > span * 0.52) return null;

    return { x: ix, y: iy };
  }

  function handleBoardTap(ev) {
    ev.preventDefault();
    const p = getIntersectionFromEvent(ev);
    if (!p) return;

    if (state.mode === MODE_DEAD) {
      toggleDeadStone(p.x, p.y);
      return;
    }

    placeStone(p.x, p.y);
  }

  function sgfCoordToXY(coord) {
    if (!coord || coord.length < 2) return null;
    return { x: coord.charCodeAt(0) - 97, y: coord.charCodeAt(1) - 97 };
  }

  function loadSgfText(text) {
    const board = createEmptyBoard();

    const abMatches = [...text.matchAll(/AB((?:\[[a-i]{2}\])+)/g)];
    const awMatches = [...text.matchAll(/AW((?:\[[a-i]{2}\])+)/g)];

    const parseMulti = (matches, color) => {
      for (const m of matches) {
        const coords = [...m[1].matchAll(/\[([a-i]{2})\]/g)].map(v => v[1]);
        for (const c of coords) {
          const p = sgfCoordToXY(c);
          if (p && inBounds(p.x, p.y)) board[p.y][p.x] = color;
        }
      }
    };

    parseMulti(abMatches, BLACK);
    parseMulti(awMatches, WHITE);

    state.initialBoard = board;
    state.board = cloneBoard(board);
    state.toMove = /PL\[W\]/.test(text) ? WHITE : BLACK;
    state.moveHistory = [];
    state.mode = MODE_NORMAL;
    state.deadStones.clear();
    state.lastMoveColor = null;
    deadModeBtn.classList.remove('btnActive');

    draw();
  }

  async function loadProblem(no) {
    const num = String(no).padStart(3, '0');

    try {
      const res = await fetch(`sgf/${num}.sgf`, { cache: 'no-store' });
      if (!res.ok) throw new Error('not found');

      const text = await res.text();
      state.currentProblemNo = parseInt(num, 10);
      loadSgfText(text);
      problemBadge.textContent = `問題 ${num}`;
      resultBox.textContent = '結　果';
    } catch (e) {
      problemBadge.textContent = '問題 ---';
      resultBox.textContent = `読込失敗`;
    }
  }

  function randomProblemNo() {
    const arr = state.problemNumbers;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  document.getElementById('loadRandomBtn').addEventListener('click', () => {
    loadProblem(randomProblemNo());
  });

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('resetBtn').addEventListener('click', resetToInitial);

  deadModeBtn.addEventListener('click', () => {
    state.mode = state.mode === MODE_DEAD ? MODE_NORMAL : MODE_DEAD;
    deadModeBtn.classList.toggle('btnActive', state.mode === MODE_DEAD);
  });

  document.getElementById('scoreBtn').addEventListener('click', scoreGame);

  canvas.addEventListener('click', handleBoardTap);
  canvas.addEventListener('touchstart', handleBoardTap, { passive: false });
  window.addEventListener('resize', draw);

  const customTitleImg = document.getElementById('customTitleImg');
  const titleWrap = document.getElementById('titleWrap');

  customTitleImg.addEventListener('load', () => {
    titleWrap.style.display = 'none';
    customTitleImg.style.display = 'block';
  });

  customTitleImg.addEventListener('error', () => {
    customTitleImg.style.display = 'none';
    titleWrap.style.display = 'flex';
  });


  const menuScreen = document.getElementById('menuScreen');
  const studyScreen = document.getElementById('studyScreen');
  const numberModal = document.getElementById('numberModal');
  const mypageModal = document.getElementById('mypageModal');
  const numberGrid = document.getElementById('numberGrid');

  let selectedMode = 'random';
  let selectedTheme = 'sakura';
  let selectedProblemNo = 1;

  function setSelected(buttons, activeButton) {
    buttons.forEach(btn => btn.classList.toggle('selected', btn === activeButton));
  }

  function applyTheme(theme) {
    selectedTheme = theme;
    document.body.classList.toggle('theme-luxury', theme === 'luxury');
  }

  function showMenu() {
    studyScreen.classList.remove('active');
    menuScreen.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showStudy(problemNo) {
    menuScreen.classList.remove('active');
    studyScreen.classList.add('active');
    requestAnimationFrame(() => {
      draw();
      if (problemNo) loadProblem(problemNo);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buildNumberGrid() {
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= 100; i++) {
      const btn = document.createElement('button');
      btn.className = 'numberBtn';
      btn.textContent = String(i).padStart(3, '0');
      btn.addEventListener('click', () => {
        selectedProblemNo = i;
        numberModal.classList.remove('open');
        showStudy(i);
      });
      frag.appendChild(btn);
    }
    numberGrid.appendChild(frag);
  }

  const modeButtons = [
    document.getElementById('modeRandomBtn'),
    document.getElementById('modeNumberBtn')
  ];
  modeButtons[0].addEventListener('click', () => {
    selectedMode = 'random';
    setSelected(modeButtons, modeButtons[0]);
  });
  modeButtons[1].addEventListener('click', () => {
    selectedMode = 'number';
    setSelected(modeButtons, modeButtons[1]);
  });

  const themeButtons = [
    document.getElementById('themeSakuraBtn'),
    document.getElementById('themeLuxuryBtn')
  ];
  themeButtons[0].addEventListener('click', () => {
    applyTheme('sakura');
    setSelected(themeButtons, themeButtons[0]);
  });
  themeButtons[1].addEventListener('click', () => {
    applyTheme('luxury');
    setSelected(themeButtons, themeButtons[1]);
  });

  document.getElementById('startLearningBtn').addEventListener('click', () => {
    if (selectedMode === 'number') {
      numberModal.classList.add('open');
    } else {
      showStudy(randomProblemNo());
    }
  });

  document.getElementById('backMenuBtn').addEventListener('click', showMenu);
  document.getElementById('closeNumberModal').addEventListener('click', () => numberModal.classList.remove('open'));
  document.getElementById('openMypageBtn').addEventListener('click', () => mypageModal.classList.add('open'));
  document.getElementById('closeMypageModal').addEventListener('click', () => mypageModal.classList.remove('open'));

  numberModal.addEventListener('click', (e) => {
    if (e.target === numberModal) numberModal.classList.remove('open');
  });
  mypageModal.addEventListener('click', (e) => {
    if (e.target === mypageModal) mypageModal.classList.remove('open');
  });

  buildNumberGrid();

  draw();
})();
</script>
</body>
</html>
